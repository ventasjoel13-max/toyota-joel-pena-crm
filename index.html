<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><meta name="description" content="Asistente personal de seguimiento de clientes Toyota."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Toyota Joel Peña CRM</title>
<style>
:root{--r:#df1e32;--ink:#171717;--line:#e5e7eb;--bg:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#171717}header{background:var(--ink);color:white;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:2}.brand{font-weight:800}.brand small{display:block;font-size:11px;color:#cbd5e1;font-weight:400}select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:9px;padding:10px;background:white;max-width:100%;width:100%}button{border:0;border-radius:9px;padding:10px 13px;background:#171717;color:white;font-weight:650;cursor:pointer}.red{background:var(--r)}.light{background:#eee;color:#222}.danger{background:#991b1b}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 60px)}nav{background:white;border-right:1px solid var(--line);padding:12px}nav button{display:block;width:100%;text-align:left;background:transparent;color:#333;margin:3px 0}nav button.active{background:#fff0f1;color:#b51222}main{padding:22px;max-width:1400px;width:100%;margin:auto}h1{margin:0 0 4px;font-size:25px}.sub,.muted{color:#687080;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}.kpi{font-size:25px;font-weight:800;margin-top:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar,.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:13px 0}.toolbar input{max-width:270px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:#687080;background:#fafafa}.tablewrap{overflow:auto}.tag{background:#f0f1f3;border-radius:20px;padding:4px 8px;font-size:11px}.empty{text-align:center;color:#687080;padding:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:12px;color:#687080;margin-bottom:5px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.dialog{background:white;border-radius:15px;padding:18px;width:min(650px,100%);max-height:90vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center}.notice{background:#fff7df;border:1px solid #efd48a;padding:12px;border-radius:9px;margin:12px 0;font-size:13px}footer{text-align:center;color:#77808d;padding:20px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:7px;border-right:0}nav button{white-space:nowrap;width:auto}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}main{padding:14px}}@media(max-width:460px){.fields{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>
<header><div class="brand">🔴 Toyota Joel Peña<small>CRM de ventas · edición local</small></div><div class="row"><button id="installBtn" class="light" style="display:none">Instalar app</button><button id="notifyBtn" class="light" style="font-size:12px">Activar avisos</button><span id="who" style="font-size:12px">Gerencia</span><select id="profile" style="width:auto;background:#292929;color:white;border-color:#555"><option>Gerente</option><option>Asesor 1</option><option>Asesor 2</option><option>Asesor 3</option></select></div></header>
<div class="layout"><nav id="nav"><button class="active" data-p="dashboard">▦ Resumen</button><button data-p="leads">♙ Prospectos</button><button data-p="agenda">▣ Agenda</button><button data-p="testdrives">🚗 Pruebas</button><button data-p="clients">♡ Clientes</button><button data-p="inventory">🚘 Inventario</button><button data-p="quotes">＄ Cotizador</button><button data-p="sales">✓ Ventas</button><button data-p="deliveries">🚚 Entregas</button><button data-p="reports">▤ Metas y reportes</button><button data-p="settings">⚙ Respaldo y equipo</button></nav><main id="main"></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h2 id="mt">Nuevo registro</h2><button class="light" onclick="closeM()">Cerrar</button></div><div id="mb"></div></div></div><footer>Los datos se guardan en este navegador. Descarga respaldos periódicamente.</footer>
<script>
const K='tjpena_crm_local_v1',blank=()=>({leads:[],appointments:[],testDrives:[],inventory:[],sales:[],payments:[],deliveries:[],team:['Asesor 1','Asesor 2','Asesor 3'],goals:{'Asesor 1':3,'Asesor 2':3,'Asesor 3':3}});let db;try{db=JSON.parse(localStorage.getItem(K))||blank()}catch(e){db=blank()}db.testDrives=db.testDrives||[];db.clientEvents=db.clientEvents||[];db.payments=db.payments||[];db.deliveries=db.deliveries||[];let pg='dashboard',who='Gerente';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(+n||0),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),visible=x=>who==='Gerente'||x.advisor===who;
function save(){localStorage.setItem(K,JSON.stringify(db));render()}function b(t,fn,c=''){return `<button class="${c}" onclick="${fn}">${t}</button>`}function table(a,cols){if(!a.length)return '<div class="empty">No hay registros todavía.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(x=>`<th>${x[0]}</th>`).join('')}</tr></thead><tbody>${a.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function shell(t,s,body){$('#main').innerHTML=`<h1>${t}</h1><p class="sub">${s}</p>${body}`}function field(l,n,v='',req=false,type='text',opts=''){let c=type==='select'?`<select name="${n}">${opts.split(',').map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${n}" rows="3">${esc(v)}</textarea>`:`<input name="${n}" type="${type}" value="${esc(v)}" ${req?'required':''}>`;return `<div class="field"><label>${l}</label>${c}</div>`}
function modal(t,body){$('#mt').textContent=t;$('#mb').innerHTML=body;$('#modal').classList.add('show')}function closeM(){$('#modal').classList.remove('show')}function advisorOpts(v){return db.team.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('')}
function render(){$('#profile').innerHTML=['Gerente',...db.team].map(n=>`<option ${n===who?'selected':''}>${esc(n)}</option>`).join('');$('#who').textContent=who==='Gerente'?'Vista gerencial':'Vista de asesor';document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===pg));({dashboard,leads,agenda,testdrives,clients,inventory,quotes,sales,deliveries,reports,settings}[pg])();if(pg==='dashboard')renderBirthdays()}
function dashboard(){let l=db.leads.filter(visible),s=db.sales.filter(visible);shell('Resumen','Actividad comercial de Toyota Joel Peña',`<div class="cards"><div class="card">Prospectos<div class="kpi">${l.length}</div></div><div class="card">En seguimiento<div class="kpi">${l.filter(x=>!['Vendido','Perdido'].includes(x.status)).length}</div></div><div class="card">Ventas<div class="kpi">${s.length}</div></div><div class="card">Importe vendido<div class="kpi">${money(s.reduce((a,x)=>a+(+x.price||0),0))}</div></div></div><div class="panel" style="margin-bottom:14px"><h2>Cumpleaños próximos</h2><div id="birthdays"></div></div><div class="panel" style="margin-bottom:14px"><h2>Mis acciones de hoy y atrasadas</h2><div id="todayTasks"></div></div><div class="panel" style="margin-bottom:14px"><h2>Próximas entregas</h2>${deliveryTable(db.deliveries.filter(visible).filter(x=>x.status!=='Entregado').sort((a,b)=>(a.expectedDate||'').localeCompare(b.expectedDate||'')).slice(0,8))}</div><div class="grid2"><div class="panel"><h2>Próximos seguimientos</h2>${table(l.filter(x=>x.follow).sort((a,b)=>a.follow.localeCompare(b.follow)).slice(0,8),[['Fecha',x=>esc(x.follow)],['Cliente',x=>esc(x.name)],['Asesor',x=>esc(x.advisor)]])}</div><div class="panel"><h2>Últimas ventas</h2>${table(s.slice(-8).reverse(),[['Fecha',x=>esc(x.date)],['Cliente',x=>esc(x.customer)],['Modelo',x=>esc(x.model)],['Importe',x=>money(x.price)]])}</div></div>`);renderBirthdays()}

function taskItems(){
 const today=new Date().toISOString().slice(0,10);
 const tasks=[];
 db.leads.filter(visible).filter(x=>x.follow && x.status!=='Vendido' && x.status!=='Perdido').forEach(x=>tasks.push({date:x.follow,time:'09:00',title:'Dar seguimiento: '+x.name,detail:(x.phone||'')+' · '+(x.model||'Cliente'),kind:'Prospecto'}));
 db.appointments.filter(visible).forEach(x=>tasks.push({date:x.date,time:x.time||'09:00',title:(x.type||'Actividad')+': '+(x.client||''),detail:'Asesor: '+(x.advisor||''),kind:'Cita'}));
 return tasks.filter(x=>x.date<=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function renderTodayTasks(){
 const el=document.getElementById('todayTasks'); if(!el)return;
 const tasks=taskItems();
 el.innerHTML=tasks.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Actividad</th><th>Detalle</th><th>Estado</th></tr></thead><tbody>${tasks.map(t=>`<tr><td>${esc(t.date)} ${esc(t.time)}</td><td><b>${esc(t.title)}</b></td><td>${esc(t.detail)}</td><td><span class="tag ${t.date<new Date().toISOString().slice(0,10)?'red':''}">${t.date<new Date().toISOString().slice(0,10)?'Atrasada':'Hoy'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">¡Sin actividades vencidas ni pendientes para hoy!</div>';
}
function leads(){shell('Prospectos','Clientes potenciales y seguimiento.',`<div class="toolbar"><input id="q" placeholder="Buscar cliente o teléfono" oninput="filterL()">${b('+ Nuevo prospecto','leadForm()','red')}</div><div class="panel" id="lt">${leadTable(db.leads.filter(visible))}</div>`)}
function leadTable(a){return table(a,[['Cliente',x=>`<b>${esc(x.name)}</b><div class="muted">${esc(x.phone)}</div>`],['Interés',x=>esc(x.model+' '+(x.version||''))],['Estatus',x=>`<span class="tag">${esc(x.status)}</span>`],['Asesor',x=>esc(x.advisor)],['Seguimiento',x=>esc(x.follow||'—')],['Acciones',x=>b('Editar',`leadForm('${x.id}')`,'light')+' '+b('Eliminar',`del('leads','${x.id}')`,'danger')]])}function filterL(){let q=$('#q').value.toLowerCase();$('#lt').innerHTML=leadTable(db.leads.filter(visible).filter(x=>(x.name+x.phone+x.model).toLowerCase().includes(q)))}
function leadForm(i){let x=db.leads.find(z=>z.id===i)||{name:'',phone:'',email:'',source:'WhatsApp',status:'Nuevo',model:'',version:'',budget:'',follow:'',notes:'',advisor:who==='Gerente'?db.team[0]:who};modal(i?'Editar prospecto':'Nuevo prospecto',`<form onsubmit="saveLead(event,'${i||''}')"><div class="fields">${field('Nombre completo','name',x.name,true)}${field('Teléfono','phone',x.phone,true)}${field('Correo','email',x.email)}${field('Origen','source',x.source,false,'select','WhatsApp,Facebook,Web,Referido,Teléfono,Visita')}${field('Estatus','status',x.status,false,'select','Nuevo,Contactado,Prueba de manejo,Cotización,Negociación,Vendido,Perdido')}${field('Modelo','model',x.model)}${field('Versión','version',x.version)}${field('Presupuesto MXN','budget',x.budget,false,'number')}${field('Próximo seguimiento','follow',x.follow,false,'date')}${field('Cumpleaños','birthday',x.birthday||'',false,'date')}${field('Fecha de compra','purchaseDate',x.purchaseDate||'',false,'date')}${field('Vehículo comprado','purchasedModel',x.purchasedModel||'',false)}${field('Color / versión comprada','purchasedDetails',x.purchasedDetails||'',false)}${field('Gustos y fechas especiales','preferences',x.preferences||'',false,'textarea')}${field('Permiso para mensajes','contactConsent',x.contactConsent||'Por confirmar',false,'select','Por confirmar,Sí,No')}${who==='Gerente'?field('Asesor','advisor',x.advisor,false,'select',db.team.join(',')):''}${field('Notas','notes',x.notes,false,'textarea')}</div><div class="actions"><button class="red">Guardar prospecto</button></div></form>`)}
function saveLead(e,i){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let x=db.leads.find(z=>z.id===i);if(x)Object.assign(x,d);else db.leads.push({id:id(),created:new Date().toISOString(),...d,advisor:d.advisor||who});closeM();save()}

function clients(){const a=db.leads.filter(visible);shell('Mis clientes','Cumpleaños, compras, preferencias e historial de cada persona.',`<div class="toolbar"><input id="cq" placeholder="Buscar cliente, teléfono o vehículo" oninput="filterClients()"></div><div class="panel" id="clientTable">${clientTable(a)}</div>`)}
function clientTable(a){return table(a,[['Cliente',x=>`<b>${esc(x.name)}</b><div class="muted">${esc(x.phone)}</div>`],['Cumpleaños',x=>esc(x.birthday||'—')],['Compró',x=>esc(x.purchasedModel||'—')],['Preferencias',x=>esc(x.preferences||'—')],['Ficha',x=>b('Ver ficha',`clientProfile('${x.id}')`,'light')]])}
function filterClients(){let q=$('#cq').value.toLowerCase();$('#clientTable').innerHTML=clientTable(db.leads.filter(visible).filter(x=>(x.name+x.phone+x.purchasedModel+x.preferences).toLowerCase().includes(q)))}
function clientProfile(i){
 const c=db.leads.find(x=>x.id===i);if(!c)return;
 const ap=db.appointments.filter(x=>x.leadId===i||x.client===c.name),td=db.testDrives.filter(x=>x.leadId===i||x.client===c.name),ss=db.sales.filter(x=>x.leadId===i||x.customer===c.name);
 const events=[];
 events.push({date:c.created?String(c.created).slice(0,10):'',type:'Primer registro',detail:'Prospecto registrado · '+(c.source||'Origen no indicado')});
 ap.forEach(x=>events.push({date:x.date||'',type:x.type||'Actividad',detail:x.notes||x.client||'Actividad agendada'}));
 td.forEach(x=>events.push({date:x.date||'',type:'Prueba de manejo',detail:(x.model||'Vehículo')+' · '+(x.status||'')+' · '+(x.result||'')}));
 ss.forEach(x=>events.push({date:x.date||'',type:'Venta',detail:(x.model||'Vehículo')+' · '+money(x.price)+' · Comisión '+money(x.commission)}));
 (db.clientEvents||[]).filter(x=>x.leadId===i).forEach(x=>events.push({date:x.date||'',type:x.type||'Nota',detail:x.detail||''}));
 events.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const timeline=events.length?`<ol style="padding-left:20px">${events.map(x=>`<li style="margin:0 0 12px"><b>${esc(x.type)}</b> <span class="muted">${esc(x.date||'Fecha no indicada')}</span><div>${esc(x.detail)}</div></li>`).join('')}</ol>`:'<div class="empty">Aún no hay movimientos en el historial.</div>';
 modal('Ficha del cliente · '+c.name,`<div class="notice"><b>Contacto:</b> ${esc(c.phone)} · ${esc(c.email||'Sin correo')}<br><b>Cumpleaños:</b> ${esc(c.birthday||'No registrado')}<br><b>Vehículo comprado:</b> ${esc(c.purchasedModel||'No registrado')}<br><b>Preferencias:</b> ${esc(c.preferences||'No registradas')}<br><b>Consentimiento de contacto:</b> ${esc(c.contactConsent||'Por confirmar')}</div><h3>Historial cronológico</h3>${timeline}<div class="actions">${b('Agregar nota al historial',`clientEventForm('${c.id}')`,'red')} ${b('Editar cliente',`closeM();leadForm('${c.id}')`,'light')} ${b('WhatsApp',`openWhatsApp('${c.id}')`,'light')}</div><h3>Resumen de compras</h3>${table(ss,[['Fecha',x=>esc(x.date)],['Unidad',x=>esc(x.model)],['Precio',x=>money(x.price)],['Comisión',x=>money(x.commission)]])}`);
}
function clientEventForm(i){const c=db.leads.find(x=>x.id===i);if(!c)return;modal('Agregar movimiento · '+c.name,`<form onsubmit="saveClientEvent(event,'${i}')"><div class="fields">${field('Fecha','date',new Date().toISOString().slice(0,10),true,'date')}${field('Tipo','type','Llamada',false,'select','Llamada,WhatsApp,Correo,Visita,Entrega,Servicio,Seguimiento,Nota')}${field('Detalle','detail','',true,'textarea')}</div><div class="actions"><button class="red">Guardar en historial</button></div></form>`)}
function saveClientEvent(e,i){e.preventDefault();db.clientEvents=db.clientEvents||[];db.payments=db.payments||[];db.clientEvents.push({id:id(),leadId:i,...Object.fromEntries(new FormData(e.target))});closeM();save();clientProfile(i)}

function openWhatsApp(i){const c=db.leads.find(x=>x.id===i);if(c)window.open('https://wa.me/'+String(c.phone||'').replace(/\D/g,''),'_blank')}
function birthdayMessage(i){const c=db.leads.find(x=>x.id===i);if(!c)return;const msg=`¡Hola ${c.name}! 🎉 Te deseo un cumpleaños lleno de alegría. Gracias por tu confianza. ¡Que tengas un excelente día!`;window.open('https://wa.me/'+String(c.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function upcomingBirthdays(){const now=new Date(),out=[];db.leads.filter(visible).forEach(c=>{if(!c.birthday)return;const d=new Date(c.birthday+'T12:00:00');let n=new Date(now.getFullYear(),d.getMonth(),d.getDate());if(n<new Date(now.getFullYear(),now.getMonth(),now.getDate()))n.setFullYear(now.getFullYear()+1);const days=Math.round((n-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);if(days<=30)out.push({...c,next:n,days})});return out.sort((a,b)=>a.days-b.days)}
function renderBirthdays(){const el=document.getElementById('birthdays');if(!el)return;const a=upcomingBirthdays();el.innerHTML=a.length?table(a,[['Fecha',x=>x.next.toLocaleDateString('es-MX')],['Cliente',x=>esc(x.name)],['En',x=>x.days===0?'Hoy':x.days+' días'],['Acción',x=>b('Felicitar por WhatsApp',`birthdayMessage('${x.id}')`,'light')]]):'<div class="empty">No hay cumpleaños en los próximos 30 días.</div>'}
function testdrives(){db.testDrives=db.testDrives||[];shell('Pruebas de manejo','Programa, registra el resultado y define el siguiente paso.',`<div class="toolbar">${b('+ Programar prueba','testDriveForm()','red')}</div><div class="panel">${table(db.testDrives.filter(visible).sort((a,b)=>a.date.localeCompare(b.date)),[['Fecha',x=>esc(x.date)],['Hora',x=>esc(x.time)],['Cliente',x=>esc(x.client)],['Vehículo',x=>esc(x.model)],['Estado',x=>esc(x.status)],['Resultado',x=>esc(x.result||'—')],['Acciones',x=>b('Editar',`testDriveForm('${x.id}')`,'light')+' '+b('Eliminar',`del('testDrives','${x.id}')`,'danger')]])}</div>`)}
function testDriveForm(i=''){let x=db.testDrives.find(z=>z.id===i)||{date:new Date().toISOString().slice(0,10),time:'10:00',client:'',model:'',status:'Programada',result:'',advisor:who==='Gerente'?db.team[0]:who,leadId:''};const opts='<option value="">Sin vincular</option>'+db.leads.filter(visible).map(c=>`<option value="${c.id}" ${x.leadId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');modal(i?'Editar prueba':'Programar prueba de manejo',`<form onsubmit="simpleSave(event,'testDrives','${i}')"><div class="fields">${field('Fecha','date',x.date,true,'date')}${field('Hora','time',x.time,false,'time')}${field('Cliente','client',x.client,true)}<div class="field"><label>Vincular contacto</label><select name="leadId">${opts}</select></div>${field('Vehículo','model',x.model,true)}${field('Estado','status',x.status,false,'select','Programada,Confirmada,Realizada,Cancelada,No asistió')}${field('Resultado / siguiente acción','result',x.result,false,'textarea')}${who==='Gerente'?field('Asesor','advisor',x.advisor,false,'select',db.team.join(',')):''}</div><div class="actions"><button class="red">Guardar prueba</button></div></form>`)}

function agenda(){shell('Agenda','Citas, llamadas y pruebas de manejo.',`<div class="toolbar">${b('+ Nueva actividad','apptForm()','red')}</div><div class="panel">${table(db.appointments.filter(visible).sort((a,b)=>a.date.localeCompare(b.date)),[['Fecha',x=>esc(x.date)],['Hora',x=>esc(x.time)],['Cliente',x=>esc(x.client)],['Tipo',x=>esc(x.type)],['Asesor',x=>esc(x.advisor)],['Acción',x=>b('Eliminar',`del('appointments','${x.id}')`,'danger')]])}</div>`)}
function apptForm(){modal('Nueva actividad',`<form onsubmit="simpleSave(event,'appointments')"><div class="fields">${field('Fecha','date',new Date().toISOString().slice(0,10),true,'date')}${field('Hora','time','10:00')}${field('Cliente','client','',true)}${field('Tipo','type','Llamada',false,'select','Llamada,Cita,Prueba de manejo,Entrega,Seguimiento')}${who==='Gerente'?field('Asesor','advisor',db.team[0],false,'select',db.team.join(',')):''}</div><div class="actions"><button class="red">Guardar</button></div></form>`)}
function inventory(){shell('Inventario','Unidades, versiones, colores y precios.',`<div class="toolbar">${b('+ Agregar unidad','unitForm()','red')}</div><div class="panel">${table(db.inventory,[['Unidad',x=>`<b>${esc(x.model)} ${esc(x.year)}</b><div class="muted">${esc(x.version)}</div>`],['Color',x=>esc(x.color)],['VIN / Stock',x=>esc(x.vin||x.stock||'—')],['Precio',x=>money(x.price)],['Estatus',x=>esc(x.status)],['Acciones',x=>b('Editar',`unitForm('${x.id}')`,'light')+' '+b('Eliminar',`del('inventory','${x.id}')`,'danger')]])}</div>`)}
function unitForm(i){let x=db.inventory.find(z=>z.id===i)||{model:'',year:2026,version:'',color:'',vin:'',stock:'',price:'',status:'Disponible'};modal('Unidad de inventario',`<form onsubmit="simpleSave(event,'inventory','${i||''}')"><div class="fields">${field('Modelo','model',x.model,true)}${field('Año','year',x.year,false,'number')}${field('Versión','version',x.version)}${field('Color','color',x.color)}${field('VIN','vin',x.vin)}${field('Número de stock','stock',x.stock)}${field('Precio MXN','price',x.price,false,'number')}${field('Estatus','status',x.status,false,'select','Disponible,Reservado,Vendido,En tránsito')}</div><div class="actions"><button class="red">Guardar unidad</button></div></form>`)}
function quotes(){shell('Cotizador','Estimación ilustrativa; confirma condiciones con la financiera.',`<div class="panel" style="max-width:620px"><div class="fields">${field('Precio unidad MXN','qp',350000,false,'number')}${field('Enganche %','qd',20,false,'number')}${field('Plazo meses','qn',48,false,'number')}${field('Tasa anual estimada %','qr',14,false,'number')}</div><div class="actions"><button class="red" onclick="calc()">Calcular mensualidad</button></div><div id="result" class="notice" hidden></div></div>`)}function calc(){let p=+$('#qp').value,d=+$('#qd').value,n=+$('#qn').value||1,r=(+$('#qr').value)/1200,fin=p*(1-d/100),pay=r?fin*r/(1-Math.pow(1+r,-n)):fin/n;$('#result').hidden=false;$('#result').innerHTML=`Enganche: <b>${money(p*d/100)}</b><br>Monto financiado: <b>${money(fin)}</b><br>Mensualidad estimada: <b>${money(pay)}</b><br><small>No incluye seguros, comisiones ni cargos adicionales.</small>`}
function sales(){
 const a=db.sales.filter(visible);
 const generated=a.reduce((n,x)=>n+(+x.commission||0)+(+x.bonus||0),0);
 const received=a.reduce((n,x)=>n+paidFor(x.id),0);
 const pending=generated-received;
 shell('Ventas y comisiones','Registra manualmente la comisión y los bonos. Lleva control de pagos recibidos y saldos pendientes.',`
 <div class="cards"><div class="card">Comisión + bonos<div class="kpi">${money(generated)}</div></div><div class="card">Pagado<div class="kpi">${money(received)}</div></div><div class="card">Pendiente<div class="kpi">${money(pending)}</div></div><div class="card">Unidades<div class="kpi">${a.length}</div></div></div>
 <div class="toolbar">${b('+ Registrar venta','saleForm()','red')}</div>
 <div class="panel">${table(a,[['Fecha',x=>esc(x.date)],['Cliente',x=>esc(x.customer)],['Modelo',x=>esc(x.model)],['Precio',x=>money(x.price)],['Comisión',x=>money(x.commission)],['Bono',x=>money(x.bonus)],['Pagado',x=>money(paidFor(x.id))],['Pendiente',x=>money((+x.commission||0)+(+x.bonus||0)-paidFor(x.id))],['Pago',x=>b('Registrar pago',`paymentForm('${x.id}')`,'light')+' '+b('Eliminar',`del('sales','${x.id}')`,'danger')]])}</div>
 <div class="panel" style="margin-top:14px"><h2>Historial de pagos</h2>${table(db.payments.filter(x=>a.some(v=>v.id===x.saleId)),[['Fecha de pago',x=>esc(x.date)],['Venta',x=>esc((db.sales.find(v=>v.id===x.saleId)||{}).customer||'Venta eliminada')],['Importe',x=>money(x.amount)],['Nota',x=>esc(x.note||'')]])}</div>`);
}
function paidFor(saleId){return (db.payments||[]).filter(x=>x.saleId===saleId).reduce((n,x)=>n+(+x.amount||0),0)}
function paymentForm(saleId){
 const x=db.sales.find(v=>v.id===saleId);if(!x)return;
 const due=(+x.commission||0)+(+x.bonus||0)-paidFor(saleId);
 modal('Registrar pago de comisión',`<div class="notice">Cliente: <b>${esc(x.customer)}</b><br>Comisión y bonos: <b>${money((+x.commission||0)+(+x.bonus||0))}</b><br>Saldo pendiente: <b>${money(due)}</b></div>
 <form onsubmit="savePayment(event,'${saleId}')"><div class="fields">${field('Fecha de pago','date',new Date().toISOString().slice(0,10),true,'date')}${field('Importe recibido MXN','amount',due>0?due:'',true,'number')}${field('Nota / referencia','note','')}</div><div class="actions"><button class="red">Guardar pago</button></div></form>`);
}
function savePayment(e,saleId){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(+d.amount<=0){alert('Captura un importe mayor a cero.');return}db.payments.push({id:id(),saleId,date:d.date,amount:+d.amount,note:d.note||''});closeM();save()}

function saleForm(){modal('Registrar venta',`<form onsubmit="simpleSave(event,'sales')"><div class="fields">${field('Fecha','date',new Date().toISOString().slice(0,10),true,'date')}${field('Cliente','customer','',true)}${field('Modelo','model','',true)}${field('Precio venta MXN','price','',true,'number')}${field('Comisión manual MXN','commission','',false,'number')}${field('Bono adicional MXN','bonus','0',false,'number')}${field('Fecha estimada de pago','expectedPayDate','',false,'date')}${who==='Gerente'?field('Asesor','advisor',db.team[0],false,'select',db.team.join(',')):''}</div><p class="muted">La comisión y el bono los capturas tú. Los pagos parciales o completos se registran después con “Registrar pago”.</p><div class="actions"><button class="red">Guardar venta</button></div></form>`)}
function deliveryTable(a){return table(a,[['Fecha estimada',x=>esc(x.expectedDate||'—')],['Cliente',x=>esc(x.customer)],['Vehículo',x=>esc(x.model)],['Estatus',x=>`<span class="tag">${esc(x.status||'Pendiente')}</span>`],['Acciones',x=>b('Editar',`deliveryForm('${x.id}')`,'light')]])}
function deliveries(){const a=db.deliveries.filter(visible).sort((x,y)=>(x.expectedDate||'').localeCompare(y.expectedDate||''));shell('Control de entregas','Programa entregas y controla documentos, placas, accesorios y preparación.',`<div class="toolbar">${b('+ Programar entrega','deliveryForm()','red')}</div><div class="panel">${deliveryTable(a)}</div>`)}
function deliveryForm(i){const x=db.deliveries.find(z=>z.id===i)||{customer:'',model:'',expectedDate:'',actualDate:'',status:'Pendiente',plates:'Pendiente',documents:'Pendiente',accessories:'Pendiente',prep:'Pendiente',notes:'',advisor:who==='Gerente'?db.team[0]:who};const opts=db.leads.filter(visible).map(c=>`<option value="${esc(c.id)}" ${x.leadId===c.id?'selected':''}>${esc(c.name)} · ${esc(c.purchasedModel||c.model||'Vehículo')}</option>`).join('');modal(i?'Editar entrega':'Programar entrega',`<form onsubmit="saveDelivery(event,'${i||''}')"><div class="fields"><div class="field"><label>Vincular cliente</label><select name="leadId"><option value="">Sin vincular</option>${opts}</select></div>${field('Nombre del cliente','customer',x.customer,true)}${field('Vehículo / versión','model',x.model,true)}${field('Fecha estimada de entrega','expectedDate',x.expectedDate,false,'date')}${field('Fecha real de entrega','actualDate',x.actualDate,false,'date')}${field('Estatus','status',x.status,false,'select','Pendiente,Listo para entregar,Entregado')}${field('Placas','plates',x.plates,false,'select','Pendiente,Listo')}${field('Documentación','documents',x.documents,false,'select','Pendiente,Listo')}${field('Accesorios','accessories',x.accessories,false,'select','Pendiente,Listo')}${field('Preparación del vehículo','prep',x.prep,false,'select','Pendiente,Listo')}${who==='Gerente'?field('Asesor','advisor',x.advisor,false,'select',db.team.join(',')):''}${field('Notas / pendientes adicionales','notes',x.notes,false,'textarea')}</div><div class="actions"><button class="red">Guardar entrega</button></div></form>`)}
function saveDelivery(e,i){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const c=db.leads.find(x=>x.id===d.leadId);if(c){d.customer=d.customer||c.name;d.model=d.model||c.purchasedModel||c.model;d.advisor=d.advisor||c.advisor;}const old=db.deliveries.find(x=>x.id===i);if(old)Object.assign(old,d);else db.deliveries.push({id:id(),...d,advisor:d.advisor||who});if(d.status==='Entregado'&&!d.actualDate)d.actualDate=new Date().toISOString().slice(0,10);closeM();save()}
function reports(){let a=db.sales.filter(visible),names=who==='Gerente'?db.team:[who];shell('Metas y reportes','Resultados y objetivos por asesor.',`<div class="cards"><div class="card">Unidades vendidas<div class="kpi">${a.length}</div></div><div class="card">Venta acumulada<div class="kpi">${money(a.reduce((s,x)=>s+(+x.price||0),0))}</div></div><div class="card">Comisiones<div class="kpi">${money(a.reduce((s,x)=>s+(+x.commission||0),0))}</div></div><div class="card">Meta total<div class="kpi">${names.reduce((s,n)=>s+(+db.goals[n]||0),0)}</div></div></div><div class="panel">${table(names.map(n=>({n,goal:db.goals[n]||0,sold:db.sales.filter(x=>x.advisor===n).length})),[['Asesor',x=>esc(x.n)],['Meta',x=>x.goal],['Ventas',x=>x.sold],['Avance',x=>`${x.goal?Math.round(x.sold/x.goal*100):0}%`],['Acción',x=>who==='Gerente'?b('Cambiar meta',`goalForm('${x.n}')`,'light'):'—']])}</div><div class="panel" style="margin-top:14px"><h2>Comisiones por mes</h2>${table([...new Set(a.map(x=>(x.date||'').slice(0,7)).filter(Boolean))].sort().reverse().map(m=>{const v=a.filter(x=>(x.date||'').startsWith(m));const total=v.reduce((n,x)=>n+(+x.commission||0)+(+x.bonus||0),0);const paid=v.reduce((n,x)=>n+paidFor(x.id),0);return {m,units:v.length,total,paid,pending:total-paid}}),[['Mes',x=>esc(x.m)],['Unidades',x=>x.units],['Generado',x=>money(x.total)],['Cobrado',x=>money(x.paid)],['Pendiente',x=>money(x.pending)]])}</div>`)}function goalForm(n){modal('Meta de '+n,`<form onsubmit="event.preventDefault();db.goals['${n}']=+this.goal.value;closeM();save()">${field('Meta mensual de unidades','goal',db.goals[n],true,'number')}<div class="actions"><button class="red">Guardar meta</button></div></form>`)}
function settings(){shell('Respaldo y equipo','Agrega perfiles locales y protege tus datos con copias.',`<div class="grid2"><div class="panel"><h2>Equipo de asesores</h2>${table(db.team.map(n=>({n})),[['Asesor',x=>esc(x.n)],['Acción',x=>b('Quitar',`removeA('${x.n}')`,'danger')]])}<div class="toolbar"><input id="newA" placeholder="Nombre del asesor">${b('Agregar asesor','addA()','red')}</div><div class="notice">Los perfiles son selectores locales, no cuentas individuales ni contraseñas. No separan de forma segura los datos.</div></div><div class="panel"><h2>Respaldo y calendario</h2><p class="muted">Exporta tus registros para pasarlos a otro dispositivo y lleva tus seguimientos al calendario de tu celular o computadora.</p><div class="actions"><button class="red" onclick="exportCalendar()">Exportar recordatorios al calendario (.ics)</button></div><p class="muted">Los avisos del calendario pueden sonar aunque cierres el CRM, según la configuración de tu calendario.</p><div class="actions">${b('Descargar respaldo','backup()','red')}<label>Importar respaldo <input type="file" accept="application/json" onchange="restore(event)"></label></div><hr><button class="danger" onclick="resetAll()">Borrar todos los datos</button></div></div>`)}
function simpleSave(e,t,i=''){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),old=db[t].find(x=>x.id===i);if(old)Object.assign(old,d);else db[t].push({id:id(),...d,advisor:d.advisor||who});if(t==='sales'&&d.leadId){let c=db.leads.find(x=>x.id===d.leadId);if(c){c.purchasedModel=d.model;c.purchaseDate=d.date;c.status='Vendido';}}closeM();save()}function del(t,i){if(confirm('¿Eliminar registro?')){db[t]=db[t].filter(x=>x.id!==i);save()}}function addA(){let n=$('#newA').value.trim();if(n&&!db.team.includes(n)){db.team.push(n);db.goals[n]=3;save()}}function removeA(n){if(confirm('Quitar perfil del selector?')){db.team=db.team.filter(x=>x!==n);save()}}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='respaldo_toyota_joel_pena.json';a.click();URL.revokeObjectURL(u)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.leads||!v.inventory||!v.sales)throw 0;if(confirm('Se reemplazarán los datos actuales. ¿Continuar?')){db=v;db.payments=db.payments||[];save();alert('Respaldo importado')}}catch(_){alert('Archivo de respaldo no válido')}};r.readAsText(f)}function resetAll(){if(confirm('¿Borrar todos los datos? Descarga antes un respaldo.')){db=blank();save()}}

function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n')}
function exportCalendar(){
 const entries=[];
 db.leads.filter(visible).filter(x=>x.follow && !['Vendido','Perdido'].includes(x.status)).forEach(x=>entries.push({date:x.follow,time:'09:00',title:'Seguimiento Toyota: '+x.name,desc:'Llamar o contactar a '+x.name+'. Tel: '+(x.phone||'')+'. Modelo: '+(x.model||'')+'. '+(x.notes||'')}));
 db.appointments.filter(visible).forEach(x=>entries.push({date:x.date,time:x.time||'09:00',title:(x.type||'Cita')+' Toyota: '+(x.client||''),desc:'Asesor: '+(x.advisor||'')}));
 (db.testDrives||[]).filter(visible).filter(x=>x.date&&x.status!=='Cancelada').forEach(x=>entries.push({date:x.date,time:x.time||'10:00',title:'Prueba de manejo: '+x.client,desc:'Vehículo: '+(x.model||'')}));
 db.deliveries.filter(visible).filter(x=>x.expectedDate&&x.status!=='Entregado').forEach(x=>entries.push({date:x.expectedDate,time:'10:00',title:'Entrega Toyota: '+x.customer,desc:'Vehículo: '+(x.model||'')+'. Estatus: '+(x.status||'Pendiente')+'. Pendientes: placas '+(x.plates||'')+', documentos '+(x.documents||'')+', accesorios '+(x.accessories||'')+', preparación '+(x.prep||'')}));
 upcomingBirthdays().forEach(x=>entries.push({date:x.next.toISOString().slice(0,10),time:'09:00',title:'Cumpleaños: '+x.name,desc:'Preparar felicitación'}));
 if(!entries.length){alert('No hay seguimientos ni citas con fecha para exportar.');return}
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Toyota Joel Pena CRM//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 entries.forEach((x,i)=>{const d=x.date.replace(/-/g,'');const t=(x.time||'09:00').replace(':','')+'00';const start=d+'T'+t;lines.push('BEGIN:VEVENT','UID:'+Date.now()+'-'+i+'@toyota-joel-pena-crm','DTSTAMP:'+stamp,'DTSTART;TZID=America/Mexico_City:'+start,'SUMMARY:'+icsEscape(x.title),'DESCRIPTION:'+icsEscape(x.desc),'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(x.title),'END:VALARM','END:VEVENT')});
 lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='recordatorios_toyota_joel_pena.ics';a.click();URL.revokeObjectURL(a.href);
}
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-block'});
document.getElementById('installBtn')?.addEventListener('click',async()=>{if(!installPrompt){alert('Para instalarla, abre esta página desde Chrome y usa el menú ⋮ > Instalar aplicación o Añadir a pantalla principal.');return}installPrompt.prompt();await installPrompt.userChoice;installPrompt=null});
document.getElementById('notifyBtn')?.addEventListener('click',async()=>{if(!('Notification'in window)){alert('Este navegador no admite notificaciones. Usa la exportación al calendario para recibir recordatorios.');return}const p=await Notification.requestPermission();alert(p==='granted'?'Avisos activados. Recibirás avisos mientras el CRM esté abierto. Para avisos fiables con la app cerrada, exporta tus citas al calendario.':'No se concedió permiso para notificaciones.')});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}

$('#nav').addEventListener('click',e=>{let x=e.target.closest('[data-p]');if(x){pg=x.dataset.p;render()}});$('#profile').addEventListener('change',e=>{who=e.target.value;render()});render();
function notifyDueWhileOpen(){
 if(!('Notification'in window)||Notification.permission!=='granted')return;
 const today=new Date().toISOString().slice(0,10), now=new Date(), stamp=today+'-'+now.getHours();
 const sent=JSON.parse(localStorage.getItem('tjpena_notified')||'{}');
 taskItems().filter(t=>t.date===today).forEach(t=>{const key=stamp+'-'+t.title;if(!sent[key]){new Notification('Toyota Joel Peña CRM',{body:t.time+' · '+t.title});sent[key]=true}});
 localStorage.setItem('tjpena_notified',JSON.stringify(sent));
}
notifyDueWhileOpen();setInterval(notifyDueWhileOpen,60000);window.addEventListener('focus',notifyDueWhileOpen);
</script></body></html>
